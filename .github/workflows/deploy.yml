# Builds the Hugo site and publishes it to the gh-pages branch.
#   push to main  -> https://pseeth.github.io/
#   pull request  -> https://pseeth.github.io/previews/pr-<number>/  (link posted on the PR)
# Closing or merging a PR removes its preview.
# Requires Settings > Pages > Source = "Deploy from a branch", branch gh-pages, folder / (root).
name: Deploy site and PR previews

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# All jobs write to gh-pages, so run them one at a time.
concurrency:
  group: gh-pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    # Fork PRs get a read-only token and can't publish, so only same-repo PRs get previews.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.121.0
      IS_PREVIEW: ${{ github.event_name == 'pull_request' }}
      PREVIEW_FOLDER: previews/pr-${{ github.event.pull_request.number }}
      PREVIEW_URL: https://pseeth.github.io/previews/pr-${{ github.event.pull_request.number }}/
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install Node.js dependencies
        if: env.IS_PREVIEW != 'true'
        run: "yarn install --frozen-lockfile"
      - name: Build with Hugo + TinaCMS
        if: env.IS_PREVIEW != 'true'
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
          NEXT_PUBLIC_TINA_CLIENT_ID: ${{ secrets.TINA_PUBLIC_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
        run: |
          yarn build
          touch public/.nojekyll
      # Previews skip the TinaCMS admin build; they only need the site itself.
      # Links are relative (relativeURLs = true), so the build works from any subfolder.
      - name: Build with Hugo (preview)
        if: env.IS_PREVIEW == 'true'
        run: hugo --environment preview
      - name: Publish site to gh-pages
        if: env.IS_PREVIEW != 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public
          clean: true
          # Keep PR previews when main redeploys the root.
          clean-exclude: |
            previews
            previews/**
      - name: Publish preview to gh-pages
        if: env.IS_PREVIEW == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public
          target-folder: ${{ env.PREVIEW_FOLDER }}
          clean: true
      - name: Comment preview link on PR
        if: env.IS_PREVIEW == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-preview -->';
            const body = `${marker}\n🔍 **Preview:** ${process.env.PREVIEW_URL}\n\nUpdated for ${context.payload.pull_request.head.sha.slice(0, 7)}. It can take a minute or two to go live.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  remove-preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PREVIEW_FOLDER: previews/pr-${{ github.event.pull_request.number }}
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Remove preview folder
        run: |
          if [ -d "${PREVIEW_FOLDER}" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git rm -rq "${PREVIEW_FOLDER}"
            git commit -m "Remove ${PREVIEW_FOLDER}"
            git push
          fi
